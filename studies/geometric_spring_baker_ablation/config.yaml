model:
  name: pet-mad-xs-v1.5.0
  version: v1.5.0
  type: pet-mad-xs

compute:
  device: cpu

neb:
  optimization:
    max_iterations: 2000
    converged_force: 0.0514221
    opt_method: lbfgs
    max_move: 0.05
    ew_ksp_min: 0.972
    ew_ksp_max: 9.72
    ew_trigger: 0.5
    climbing_image_method: true
    ci_after_rel: 0.5
    ci_mmf: true
    ci_mmf_nsteps: 1000
    sidpp_growth_alpha: 0.33

plotting:
  facecolor: white
  figure:
    dpi: 300
    zoom_ratio: 0.4
  fonts:
    base: 12
  ira_kmax: 14

paths:
  models: results/models
  sweeps: studies/geometric_spring_baker_ablation/results/sweeps

resources:
  neb:
    runtime: 180
    mem_mb: 64000
    cpus_per_task: 8
  analysis:
    runtime: 90
    mem_mb: 32000
    cpus_per_task: 4
  figures:
    runtime: 60
    mem_mb: 32000
    cpus_per_task: 4

sweeps:
  geometric_spring_density:
    images: [18, 36, 54, 72, 90]
    spring_modes:
      hookean:
        spring: 5.0
        energy_weighted: false
        geometric_spring: false
      hookean_energy_weighted:
        spring: 5.0
        energy_weighted: true
        geometric_spring: false
      geometric:
        spring: 5.0
        energy_weighted: false
        geometric_spring: true
    bayes:
      chains: 4
      samples: 1000
      warmup: 1000
    visuals:
      images: [90]
      spring_modes: [hookean, hookean_energy_weighted, geometric]
      plot_types: [profile_path, profile_index, landscape_rmsd]
