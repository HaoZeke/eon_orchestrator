# Alanine Dipeptide: C7eq -> C5 (beta) Conformational Change
# Phi/Psi rotation from folded to extended conformation

systems:
  alanine_dipeptide:
    reactant: examples/alanine_dipeptide/c7eq.xyz
    product: examples/alanine_dipeptide/c5.xyz
    use_ira: true

alignment:
  kmax: 2.0  # Higher for flexible peptide

neb:
  optimization:
    images: 21
    max_iterations: 2000

plotting:
  title: "Alanine Dipeptide: C7eq to C5"
