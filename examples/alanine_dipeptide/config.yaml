# Alanine Dipeptide: C7eq -> C5 (beta) Conformational Change
# Phi/Psi rotation from folded to extended conformation

systems:
  alanine_dipeptide:
    reactant: examples/alanine_dipeptide/c7eq.xyz
    product: examples/alanine_dipeptide/c5.xyz
    use_ira: true

model:
  name: pet-mad-xs-v1.5.0
  version: v1.5.0
  type: pet-mad-xs

compute:
  device: cpu

alignment:
  kmax: 2.0  # Higher for flexible peptide

neb:
  minimization:
    max_iterations: 2000
    converged_force: 0.0514221
    opt_method: lbfgs
    max_move: 0.1

  optimization:
    images: 21
    max_iterations: 2000
    converged_force: 0.0514221
    opt_method: lbfgs
    max_move: 0.1
    energy_weighted: true
    ew_ksp_min: 0.972
    ew_ksp_max: 9.72
    ew_trigger: 0.5
    climbing_image_method: true
    ci_after_rel: 0.8
    ci_mmf: true
    ci_mmf_nsteps: 1000
    sidpp_growth_alpha: 0.33

plotting:
  plot_structures: true
  facecolor: white
  title: "Alanine Dipeptide: C7eq to C5"
  figure:
    figsize: [5.3, 5.3]
    dpi: 300
    zoom_ratio: 0.03
  fonts:
    base: 12
  draw_reactant: {x: 0.15, y: 0.1, rad: 0.12}
  draw_product: {x: 0.85, y: 0.1, rad: 0.12}
  draw_saddle: {x: 0.5, y: 0.6, rad: 0.15}
  ira_kmax: 14
  aserot: "90x,90y,90z"

paths:
  models: results/models
  endpoints: results/endpoints
  neb: results/neb
  idpp: results/idpp
  plots: results/plots
  cache: results/cache
