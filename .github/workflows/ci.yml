name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workflow and configs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Lint YAML configs
        run: pixi run lint

      - name: Dry-run workflow
        run: pixi run validate

      - name: Validate example configs
        run: |
          pixi run -- python -c "
          import yaml, pathlib
          for cfg in pathlib.Path('examples').glob('*/config.yaml'):
              with open(cfg) as f:
                  config = yaml.safe_load(f)
              assert 'systems' in config, f'{cfg}: missing systems'
              print(f'{cfg}: valid')
          "
