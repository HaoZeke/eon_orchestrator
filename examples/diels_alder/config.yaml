# Diels-Alder: Butadiene + Ethylene -> Cyclohexene
# [4+2] cycloaddition with ring closure

systems:
  diels_alder:
    reactant: examples/diels_alder/reactant.xyz
    product: examples/diels_alder/product.xyz
    use_ira: true

alignment:
  kmax: 2.0  # Higher for multi-molecular alignment

neb:
  optimization:
    images: 20
    max_iterations: 1500

plotting:
  title: "Diels-Alder Reaction"
