[workspace]
name = "eon_orchestrator"
channels = ["conda-forge", "metatensor"]
platforms = ["linux-64"]

# Default environment tasks (validation, plotting - no eonclient needed)
[tasks]
validate = "snakemake -n"
plot-hcn = "python -m rgpycrumbs.cli eon plt-neb --con-file results/neb/hcn_isom/neb.con --plot-type landscape --project-path --show-pts --landscape-path all --plot-structures crit_points --surface-type grad_imq --ira-kmax 14 --show-legend"
plot-sn2 = "python -m rgpycrumbs.cli eon plt-neb --con-file results/neb/sn2_f_ch3f/neb.con --plot-type landscape --project-path --show-pts --landscape-path all --plot-structures crit_points --surface-type grad_imq --ira-kmax 14 --show-legend"
plot-diels = "python -m rgpycrumbs.cli eon plt-neb --con-file results/neb/diels_alder/neb.con --plot-type landscape --project-path --show-pts --landscape-path all --plot-structures crit_points --surface-type grad_imq --ira-kmax 14 --show-legend"
plot-vinyl = "python -m rgpycrumbs.cli eon plt-neb --con-file results/neb/vinyl_alcohol/neb.con --plot-type landscape --project-path --show-pts --landscape-path all --plot-structures crit_points --surface-type grad_imq --ira-kmax 14 --show-legend"
clean = "rm -rf results/"
lint = "yamllint config/config.yaml examples/*/config.yaml"

# Eon environment tasks (requires eonclient)
[feature.eon.tasks]
hcn = "snakemake --configfile examples/hcn_isom/config.yaml -c4"
sn2 = "snakemake --configfile examples/sn2_f_ch3f/config.yaml -c4"
diels-alder = "snakemake --configfile examples/diels_alder/config.yaml -c4"
vinyl-alcohol = "snakemake --configfile examples/vinyl_alcohol/config.yaml -c4"
alanine = "snakemake --configfile examples/alanine_dipeptide/config.yaml -c4"

[dependencies]
python = ">=3.11,<3.13"
pip = "*"
conda = ">=26.1.1,<27"
yamllint = "*"

[pypi-dependencies]
jax = "*"
jaxlib = "*"
chemparseplot = ">=1.3.0"
h5py = "*"
rgpycrumbs = ">=0.1.0"
polars = "*"
adjustText = "*"
ase = ">=3.24"
matplotlib = ">=3.9"
numpy = ">=2.0"
scipy = ">=1.14"
snakemake = ">=9.0"

[feature.eon.dependencies]
eon = ">=2.12.0,<3"

[feature.eon.pypi-dependencies]
torch = ">=2.5"
metatomic-torch = ">=0.1.7"
metatensor-torch = ">=0.8"
metatrain = ">=2026.2.1"
vesin = ">=0.4"
vesin-torch = ">=0.4"

[feature.docs.dependencies]
python = ">=3.12,<4"
emacs = ">=30.2,<31"
pandoc = ">=3.9,<4"

[feature.docs.pypi-dependencies]
shibuya = ">=2025.12.13,<2026"
sphinx = ">=9.0.4,<10"
sphinx-sitemap = ">=2.9.0,<3"
sphinxcontrib-programoutput = ">=0.18,<0.19"

[feature.docs.tasks]
mkrst = { cmd = "emacs --batch --load export.el", cwd = "docs" }
sphinxbld = { cmd = "sphinx-build docs/source/ docs/build", depends-on = ["mkrst"] }
docbld = { depends-on = ["sphinxbld"] }
docdel = { cmd = "rm -rf build; rm -rf source/*.rst source/tutorials/*.rst source/reference/*.rst source/contributing/*.rst", cwd = "docs" }

[environments]
default = ["default"]
eon = ["default", "eon"]
docs = ["default", "docs"]
